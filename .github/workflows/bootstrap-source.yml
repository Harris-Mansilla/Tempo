name: Bootstrap Tempo source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source files
        shell: bash
        run: |
          if [ ! -f .bootstrap/READY ]; then
            echo 'Bootstrap payload already consumed.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payloads = {
              'app': 'app.js',
              'styles': 'styles.css',
              'build': 'build.py',
          }
          root = Path('.bootstrap')
          for stem, target in payloads.items():
              parts = sorted(root.glob(f'{stem}.[0-9][0-9]'))
              if not parts:
                  raise SystemExit(f'Missing payload for {stem}')
              encoded = ''.join(p.read_text() for p in parts)
              Path(target).write_bytes(gzip.decompress(base64.b64decode(encoded)))
              print(f'Restored {target} from {len(parts)} chunk(s)')
          PY
          python3 build.py
          mv ../Stride.html ./Stride.html
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Tempo application source and portable build'
          git push
